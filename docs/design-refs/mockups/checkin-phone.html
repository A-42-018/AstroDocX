<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mockup · Check-in phone v3</title>
<link rel="stylesheet" href="hud.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  body { width: 390px; height: 844px; }
  .stage { width: 390px; height: 844px; display: grid; grid-template-rows: auto 1fr 64px; --cut: 10px; }
  .tb { padding: 10px 14px; border-bottom: 1px solid var(--edge); background: rgba(4, 12, 18, 0.95); display: grid; gap: 10px; }
  .r1 { display: flex; align-items: center; gap: 10px; }
  .logo { width: 26px; height: 26px; display: grid; place-content: center; font: 800 18px/1 var(--disp); color: #03141a; background: var(--cy); box-shadow: 0 0 14px var(--cy-glow); clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .r2 { display: flex; align-items: center; gap: 8px; }
  .av { width: 34px; height: 34px; display: grid; place-content: center; border-radius: 50%; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--t2); background: #07141c; border: 2px solid var(--st); }
  .av.on { color: #02121a; background: var(--st); box-shadow: 0 0 12px var(--st); }
  .lk { flex: 1; height: 34px; display: flex; align-items: center; justify-content: center; gap: 7px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--watch); border: 1px solid var(--edge); }
  main { overflow: hidden; padding: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
  /* Stepper collapses to a 4-segment strip with names */
  .strip4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 10px 12px 12px; }
  .strip4 div { display: grid; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--t3); text-transform: uppercase; }
  .strip4 i { height: 4px; background: rgba(70, 225, 245, 0.14); }
  .strip4 .done { color: var(--ok); } .strip4 .done i { background: var(--ok); box-shadow: 0 0 8px -1px var(--ok); }
  .strip4 .cur { color: var(--cy-hi); } .strip4 .cur i { background: var(--cy); box-shadow: 0 0 10px var(--cy); }
  .q { display: grid; grid-template-rows: auto auto 1fr auto; padding: 14px 14px 14px; }
  .q h1 { margin: 6px 0 2px; font-family: var(--disp); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .q .sub { margin: 0 0 14px; font-size: 14px; color: var(--t2); }
  .tiles { display: grid; gap: 8px; align-content: start; }
  .tile { position: relative; height: 56px; display: grid; grid-template-columns: 30px 24px 1fr; gap: 12px; align-items: center; padding: 0 14px; color: var(--t2);
    clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    background: linear-gradient(160deg, rgba(70, 225, 245, 0.32), rgba(70, 225, 245, 0.12) 40%, rgba(70, 225, 245, 0.12) 70%, rgba(70, 225, 245, 0.3)); isolation: isolate; }
  .tile::before { content: ''; position: absolute; inset: 1px; z-index: -1; background: rgba(4, 13, 20, 0.92); clip-path: polygon(0 7.5px, 7.5px 0, 100% 0, 100% calc(100% - 7.5px), calc(100% - 7.5px) 100%, 0 100%); }
  .tile svg { width: 24px; height: 24px; color: var(--t3); stroke-width: 1.6; }
  .tile .n { font-family: var(--disp); font-size: 22px; font-weight: 600; color: var(--t1); }
  .tile .w { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  .tile.on { color: var(--cy-hi); background: linear-gradient(160deg, var(--cy), rgba(54, 226, 245, 0.5) 40%, rgba(54, 226, 245, 0.5) 70%, var(--cy)); }
  .tile.on::before { background: linear-gradient(90deg, rgba(54, 226, 245, 0.22), rgba(54, 226, 245, 0.06)), rgba(4, 13, 20, 0.92); }
  .tile.on svg { color: var(--cy); filter: drop-shadow(0 0 6px var(--cy-glow)); }
  .field { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; margin-top: 12px; }
  .inp { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: 1px solid var(--edge-hi); background: rgba(2, 8, 12, 0.8); }
  .inp b { flex: 1; font-family: var(--disp); font-size: 20px; color: var(--t3); }
  .navb { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding-top: 12px; border-top: 1px solid var(--edge); }
  .navb .btn { height: 46px; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--edge); background: rgba(3, 10, 16, 0.96); }
  .tabs a { position: relative; display: grid; justify-items: center; align-content: center; gap: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--t3); }
  .tabs a svg { width: 20px; height: 20px; }
  .tabs a.on { color: var(--cy-hi); background: linear-gradient(0deg, transparent, rgba(54, 226, 245, 0.12)); }
  .tabs a.on::before { content: ''; position: absolute; top: -1px; left: 20%; right: 20%; height: 2px; background: var(--cy); box-shadow: 0 0 10px var(--cy); }
  .tabs .n { position: absolute; top: 8px; right: 18px; padding: 0 4px; font-size: 11px; color: #2a0510; background: var(--act); }
</style></head>
<body>
<div class="stage">
  <header class="tb">
    <div class="r1"><span class="logo">+</span><div style="flex:1"><div class="eb" style="font-size:11px">Daily check-in</div><div style="font-size:15px;color:var(--t2)">Two minutes, <b style="color:var(--t1)">Pilot</b></div></div>
      <b class="mono cy" style="font-size:13px;text-shadow:0 0 10px var(--cy-glow)">D29 23:00</b></div>
    <div class="r2"><span class="av" style="--st:var(--ok)">CO</span><span class="av" style="--st:var(--act)">FE</span><span class="av" style="--st:var(--ok)">MO</span><span class="av on" style="--st:var(--act)">PI</span>
      <span class="lk"><span class="lamp"></span>LINK 1H · 3</span><i data-lucide="ellipsis-vertical" style="color:var(--t3)"></i></div>
  </header>
  <main>
    <section class="hp strip4">
      <div class="done"><i></i>1 Mood</div><div class="cur"><i></i>2 Sleep</div><div><i></i>3 Sympt.</div><div><i></i>4 Reaction</div>
    </section>
    <section class="hp q">
      <span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br brr"></span>
      <div class="eb cy">Q2 · Sleep quality · step 2 / 4</div>
      <div><h1>How well did you sleep?</h1><p class="sub">Think of your last main sleep period.</p></div>
      <div>
        <div class="tiles">
          <div class="tile"><i data-lucide="battery-low"></i><span class="n">1</span><span class="w">Very poor</span></div>
          <div class="tile on"><i data-lucide="battery-warning"></i><span class="n">2</span><span class="w">Poor</span></div>
          <div class="tile"><i data-lucide="battery-medium"></i><span class="n">3</span><span class="w">Fair</span></div>
          <div class="tile"><i data-lucide="battery-full"></i><span class="n">4</span><span class="w">Good</span></div>
          <div class="tile"><i data-lucide="battery-charging"></i><span class="n">5</span><span class="w">Very good</span></div>
        </div>
        <div class="field"><span class="eb">Hours slept · optional</span><span class="inp"><b>5.1</b><span class="unit">h</span></span></div>
      </div>
      <div class="navb"><button class="btn ghost"><i data-lucide="arrow-left" style="width:16px"></i>Back</button><button class="btn">Next<i data-lucide="arrow-right" style="width:16px"></i></button></div>
    </section>
  </main>
  <nav class="tabs">
    <a><i data-lucide="layout-dashboard"></i>BOARD</a><a><i data-lucide="siren"></i>ALERTS<span class="n">3</span></a><a><i data-lucide="chart-line"></i>TRENDS</a><a class="on"><i data-lucide="clipboard-check"></i>CHECK</a><a><i data-lucide="ellipsis"></i>MORE</a>
  </nav>
</div>
<script>if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.9 } });</script>
</body></html>
